const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=document.getElementById("msg");
if(!window.crypto||!crypto.subtle) msg.textContent="Questa pagina va aperta dal link https ricevuto.";
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); msg.textContent="Apertura in corso…"; document.getElementById("b").disabled=true;
  try{
    const pw=new TextEncoder().encode(document.getElementById("p").value.trim());
    const base=await crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALE),iterations:GIRI,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const chiaro=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},k,b64(DATI));
    const html=new TextDecoder().decode(chiaro);
    document.open(); document.write(html); document.close();
  }catch(err){ msg.textContent="Password non corretta."; document.getElementById("b").disabled=false; }
});
})();
